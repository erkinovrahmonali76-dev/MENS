<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16140f;--muted:#847d6d;--line:#e7e1d4;--bg:#f4f1ea;--card:#fff;--gold:#a98547;--ok:#2e7d4f;--warn:#b7791f;--bad:#b3392f;--blue:#2b5f9e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login form{background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px;width:100%;max-width:380px;box-shadow:0 20px 40px -20px rgba(0,0,0,.2)}
.login h1{font-size:22px;margin-bottom:4px}.login p{color:var(--muted);margin-bottom:20px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--ink);color:#cfc6b0;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside .brand{color:#fff;font-weight:700;letter-spacing:.12em;padding:0 10px 18px;font-size:16px}aside .brand span{color:var(--gold)}
aside button.nav{display:flex;width:100%;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;text-align:left;font-weight:500;margin-bottom:3px}
aside button.nav:hover{background:#2a261c}aside button.nav.on{background:var(--gold);color:#fff}
aside .sp{flex:1}
.pill{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
main{padding:26px 30px 60px;min-width:0}
h1.t{font-size:24px;margin-bottom:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.stat small{color:var(--muted);font-size:12.5px}.stat b{display:block;font-size:24px;margin-top:4px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:20px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid #f0ebe0;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:#faf7f0}
.thumb{width:44px;height:50px;border-radius:8px;object-fit:cover;background:#eee}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;background:var(--ink);color:#fff;transition:.15s}
.btn:hover{opacity:.88}.btn.gold{background:var(--gold)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn.line{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.sm{padding:6px 12px;font-size:13px}.btn[disabled]{opacity:.5;pointer-events:none}
.st{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.st-new{background:#e9eef7;color:var(--blue)}.st-pending_payment,.pp-pending{background:#fbf1de;color:var(--warn)}
.st-confirmed,.pp-paid{background:#e8f4ec;color:var(--ok)}.st-shipping{background:#efe6f8;color:#6b3fa0}
.st-done{background:#dff3e6;color:#1f6b3f}.st-cancelled{background:#fbeceb;color:var(--bad)}.pp-unpaid{background:#eee;color:#666}
.field{margin-bottom:13px}.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:#4a4437}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:#fff;outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field small{color:var(--muted);font-size:12px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{background:#fbeceb;color:var(--bad);border-radius:9px;padding:9px 13px;margin-bottom:12px}
.modalbg{position:fixed;inset:0;background:rgba(20,16,8,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;z-index:100}
.modal{background:#fff;border-radius:16px;width:100%;max-width:720px;padding:24px;position:relative}
.modal h2{font-size:20px;margin-bottom:16px}.modal .x{position:absolute;right:14px;top:12px;font-size:26px;color:var(--muted)}
.imgs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.imgs .im{position:relative}.imgs img{width:82px;height:92px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.imgs .im button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;font-size:14px;line-height:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin-bottom:14px}.kv span{color:var(--muted)}
.receipt{max-width:100%;max-height:420px;border-radius:10px;border:1px solid var(--line);margin-top:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;opacity:0;transition:.3s;z-index:300;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:500}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.topm{display:none}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px;padding:10px}aside .brand{width:100%;padding:4px 8px}aside .sp{display:none}aside button.nav{width:auto;padding:8px 12px;margin:0}main{padding:18px 14px 50px}.frow,.kv{grid-template-columns:1fr}}

.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:11px;color:var(--muted)}
.chart .bar{width:100%;max-width:48px;background:var(--gold);border-radius:6px 6px 0 0}
.two2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.top{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0ebe0}.top:last-child{border:0}.top .nm{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{padding:9px 14px;border:1.5px solid var(--line);border-radius:999px;background:#fff;min-width:230px;outline:0;font-size:14px;font-weight:400}.search:focus{border-color:var(--gold)}
.live{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#9a917c}.live i{width:8px;height:8px;border-radius:50%;background:#777}.live.on i{background:#4cc47c;box-shadow:0 0 0 4px rgba(76,196,124,.2)}
@media(max-width:860px){.two2{grid-template-columns:1fr}.search{min-width:0;width:100%}}
@media print{body>*:not(.modalbg){display:none!important}.modalbg{position:static;background:none;padding:0}.modal{max-width:none;padding:0}.modal .x,.noprint{display:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script src="/admin.js"></script>
</body>
</html>
