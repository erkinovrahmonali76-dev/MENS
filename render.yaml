services:
  - type: web
    name: elite-men-shop
    runtime: node
    plan: free
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
